[tox]
requires =
    tox-uv
    tox-gh
env_list =
    py{310,311,312,313}-dj52-wt{63,70}
    py{310,311,312,313,314}-dj52-wt{74,80}
    py{312,313,314}-dj{60,61}-wt{74,80}
skip_missing_interpreters = true

[gh]
python =
    3.10 = py310-dj52-wt63, py310-dj52-wt70, py310-dj52-wt74, py310-dj52-wt80
    3.11 = py311-dj52-wt63, py311-dj52-wt70, py311-dj52-wt74, py311-dj52-wt80
    3.12 = py312-dj52-wt63, py312-dj52-wt70, py312-dj52-wt74, py312-dj52-wt80, py312-dj60-wt74, py312-dj60-wt80, py312-dj61-wt74, py312-dj61-wt80
    3.13 = py313-dj52-wt63, py313-dj52-wt70, py313-dj52-wt74, py313-dj52-wt80, py313-dj60-wt74, py313-dj60-wt80, py313-dj61-wt74, py313-dj61-wt80
    3.14 = py314-dj52-wt74, py314-dj52-wt80, py314-dj60-wt74, py314-dj60-wt80, py314-dj61-wt74, py314-dj61-wt80

[testenv]
package = editable
dependency_groups = dev
setenv =
    DJANGO_SETTINGS_MODULE = wagtailmetadata.tests.settings
deps =
    dj52: django>=5.2,<5.3
    dj60: django>=6.0,<6.1
    dj61: django>=6.1,<6.2
    wt63: wagtail>=6.3,<6.4
    wt70: wagtail>=7.0,<7.1
    wt74: wagtail>=7.4,<7.5
    wt80: wagtail>=8.0,<8.1
commands =
    pytest {posargs}
